# Local demo only. Generated data; never connect real health accounts in demo mode.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_DB: pulse
      POSTGRES_PASSWORD: pulse-local-demo
    volumes:
      - pulse-local-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 2s
      timeout: 3s
      retries: 30
  pulse:
    build: .
    environment:
      DATA_SOURCE: demo
      DATABASE_URL: postgres://pulse:pulse-local-demo@db:5432/pulse
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
  review:
    profiles: ["review"]
    build:
      context: .
      target: build
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    mem_limit: 3g
volumes:
  pulse-local-pg:
